name: "🐛 Hata bildirimi"
description: "ADB Player Android'de karşılaştığınız bir sorunu bildirin"
title: "[Hata] "
body:
  - type: markdown
    attributes:
      value: |
        Hata bildirdiğiniz için teşekkürler. Lütfen parola, oturum belirteci, API anahtarı ve özel dosya bağlantısı paylaşmayın.
  - type: input
    id: app-version
    attributes:
      label: ADB Player sürümü
      placeholder: "Örn. 0.5.4 (58)"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Cihaz ve Android sürümü
      placeholder: "Örn. Mi 9 Lite, Android 10"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Sorun nasıl tekrarlanıyor?
      description: Adımları sırayla anlatın.
      placeholder: |
        1. Uygulamayı açtım
        2. ... bölümüne girdim
        3. ... işlemini yaptım
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Gerçekte ne oldu?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ne olmasını bekliyordunuz?
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Ek bilgiler (isteğe bağlı)
      description: Kişisel bilgileri gizlediğiniz ekran görüntülerini veya hata mesajlarını ekleyebilirsiniz.
